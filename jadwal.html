<script src="main.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli',
                 'Agustus','September','Oktober','November','Desember'];
  const BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

  const elTabs   = document.getElementById('dayTabs');
  const elIsi    = document.getElementById('jadwalIsi');
  const elCari   = document.getElementById('cari');
  const elMeta   = document.getElementById('jadwalMeta');
  const elNav    = document.getElementById('weekNav');
  const elRange  = document.getElementById('weekRange');
  const elSemester = document.getElementById('kotakSemester');
  const elPerub  = document.getElementById('kotakPerubahan');
  const elPering = document.getElementById('kotakPeringatan');
  const btnPrev  = document.getElementById('prevWeek');
  const btnNext  = document.getElementById('nextWeek');
  const btnThis  = document.getElementById('thisWeek');

  let data = null;
  let offsetMinggu = 0;      // 0 = minggu ini, -1 = minggu lalu, dst.
  let hariAktif = null;

  /* ---------- util ---------- */

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
  }

  const p2 = n => String(n).padStart(2,'0');

  // Tanggal lokal (WIB di sisi pengunjung), BUKAN UTC. Kalau pakai
  // toISOString(), pengunjung sebelum jam 07.00 WIB akan melihat tanggal kemarin.
  function iso(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }

  function tambahHari(d, n){
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }

  // Senin pada minggu yang memuat tanggal d.
  function seninMinggu(d){
    const hari = d.getDay();                    // 0 = Minggu
    return tambahHari(d, hari === 0 ? -6 : 1 - hari);
  }

  function dariIso(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  function tglPanjang(s){
    const d = dariIso(s);
    return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
  }

  function tglPendek(d){ return `${d.getDate()} ${BULAN_SINGKAT[d.getMonth()]}`; }

  function menitMulai(jam){
    const m = String(jam).match(/(\d{1,2})[.:](\d{2})/);
    return m ? (+m[1]*60 + +m[2]) : 0;
  }

  function cocok(k, q){
    if(!q) return true;
    return [k.kode,k.nama,k.kp,k.jam,k.ruang].join(' ').toLowerCase().includes(q);
  }

  /* ---------- susun jadwal satu hari, sudah termasuk perubahan ---------- */

  // Tanggal mulai perkuliahan untuk satu mata kuliah (lihat data/mulai.json).
  function mulaiUntuk(kode){
    const m = data.mulai;
    if(!m) return null;
    return (m.perMatkul && m.perMatkul[kode]) || m.default || null;
  }

  function kelasHari(namaHari, tanggalIso){
    const dasar = (data.days.find(d => d.day === namaHari)?.classes || []);
    const perub = (data.changes || []).filter(c => c.tanggal === tanggalIso);

    const kunci = c => `${c.kode}|${c.kp}`.toUpperCase();

    const libur = new Map();
    for(const c of perub.filter(c => c.tipe === 'libur')) libur.set(kunci(c), c);

    // Pindah ruang dan daring sama-sama hanya mengubah TEMPAT, jamnya tetap,
    // jadi keduanya ditangani lewat jalur yang sama.
    const gantiRuang = new Map();
    for(const c of perub.filter(c => c.tipe === 'ruang')) gantiRuang.set(kunci(c), c);

    const daring = new Map();
    for(const c of perub.filter(c => c.tipe === 'daring')) daring.set(kunci(c), c);

    // Kelas yang dipindah tapi jadwal penggantinya belum ditentukan. Pada
    // tanggal ini kelasnya tidak berlangsung, sama seperti ditiadakan, hanya
    // saja penggantinya sudah pasti akan ada.
    const menyusul = new Map();
    for(const c of perub.filter(c => c.tipe === 'menyusul')) menyusul.set(kunci(c), c);

    const hasil = dasar.map(k => {
      // Kelas yang perkuliahannya belum dimulai tidak bisa "ditiadakan".
      // status ini diperiksa lebih dulu.
      const mulai = mulaiUntuk(k.kode);
      if(mulai && tanggalIso < mulai){
        return { ...k, status:'belum', catatan:`Perkuliahan dimulai ${tglPanjang(mulai)}` };
      }
      const c = libur.get(kunci(k));
      if(c) return { ...k, status:'libur', catatan:c.catatan };

      const s = menyusul.get(kunci(k));
      if(s) return { ...k, status:'menyusul', catatan:s.catatan };

      const d = daring.get(kunci(k));
      if(d) return { ...k, ruang: 'Online', status:'daring', catatan: d.catatan };

      const g = gantiRuang.get(kunci(k));
      if(g) return { ...k, ruang: g.ruang || k.ruang, status:'ruang', catatan: g.catatan };

      return { ...k, status:'normal', catatan:'' };
    });

    for(const c of perub.filter(c => c.tipe === 'pengganti')){
      hasil.push({
        kode:c.kode, nama:c.nama, kp:c.kp, jam:c.jam, ruang:c.ruang,
        status:'pengganti', catatan:c.catatan
      });
    }

    hasil.sort((a,b) => menitMulai(a.jam) - menitMulai(b.jam));
    return hasil;
  }

  /* ---------- render ---------- */

  // Hari yang ditampilkan = hari di jadwal tetap, ditambah hari mana pun yang
  // kebetulan punya kelas pengganti pada minggu ini (mis. Sabtu).
  function daftarHari(senin){
    const nama = data.days.map(d => d.day);
    const extra = new Set();
    for(let i=0;i<7;i++){
      const t = iso(tambahHari(senin,i));
      if((data.changes||[]).some(c => c.tanggal === t && c.tipe === 'pengganti')){
        extra.add(HARI[tambahHari(senin,i).getDay()]);
      }
    }
    const urut = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
    return urut.filter(h => nama.includes(h) || extra.has(h));
  }

  function tanggalHari(senin, namaHari){
    for(let i=0;i<7;i++){
      const d = tambahHari(senin,i);
      if(HARI[d.getDay()] === namaHari) return d;
    }
    return senin;
  }

  function render(){
    const senin = tambahHari(seninMinggu(new Date()), offsetMinggu*7);
    const hariList = daftarHari(senin);

    if(!hariList.includes(hariAktif)) hariAktif = hariList[0];

    const jumat = tanggalHari(senin, hariList[hariList.length-1]);
    elRange.textContent = `${tglPendek(senin)} - ${tglPendek(jumat)} ${jumat.getFullYear()}`;
    btnThis.hidden = offsetMinggu === 0;
    elNav.hidden = false;

    // Tab hari
    const hariIniIso = iso(new Date());
    elTabs.innerHTML = hariList.map(h => {
      const d = tanggalHari(senin, h);
      const aktif = h === hariAktif;
      const isToday = iso(d) === hariIniIso;
      const adaPerubahan = (data.changes||[]).some(c => c.tanggal === iso(d));
      return `<button role="tab" aria-selected="${aktif}" class="day-tab${aktif?' active':''}" data-hari="${esc(h)}">
        ${isToday ? '<span class="dot-today" aria-hidden="true"></span>' : ''}
        <span>${esc(h)}<span class="tab-date">${esc(tglPendek(d))}</span></span>
        ${adaPerubahan ? '<span class="dot-change" aria-hidden="true" title="ada perubahan"></span>' : ''}
      </button>`;
    }).join('');

    elTabs.querySelectorAll('.day-tab').forEach(btn => {
      btn.addEventListener('click', () => { hariAktif = btn.dataset.hari; render(); });
    });

    // Tabel
    const tgl = tanggalHari(senin, hariAktif);
    const q = elCari.value.trim().toLowerCase();
    const semua = kelasHari(hariAktif, iso(tgl));
    const kelas = semua.filter(k => cocok(k, q));

    if(kelas.length === 0){
      elIsi.innerHTML = `<div class="jadwal-card"><p class="jadwal-status">${
        q ? `Tidak ada kelas pada ${esc(tglPanjang(iso(tgl)))} yang cocok dengan “${esc(elCari.value.trim())}”.`
          : `Tidak ada kelas terjadwal pada ${esc(tglPanjang(iso(tgl)))}.`
      }</p></div>`;
      return;
    }

    const KELAS_BARIS = {
      libur:'row-libur', pengganti:'row-pengganti',
      belum:'row-belum', ruang:'row-ruang', daring:'row-daring',
      menyusul:'row-menyusul',
    };
    const LABEL = {
      libur: '<span class="tag tag-libur">Ditiadakan</span>',
      pengganti: '<span class="tag tag-pengganti">Kelas pengganti</span>',
      belum: '<span class="tag tag-belum">Belum dimulai</span>',
      ruang: '<span class="tag tag-ruang">Pindah ruang</span>',
      daring: '<span class="tag tag-daring">Online</span>',
      menyusul: '<span class="tag tag-menyusul">Jadwal menyusul</span>',
    };

    const baris = kelas.map(k => {
      const cls = KELAS_BARIS[k.status] || '';
      const badge = LABEL[k.status] || '';
      return `
      <tr class="${cls}">
        <td class="col-jam"><span class="jam-pill">${esc(k.jam)}</span></td>
        <td class="col-matkul">
          <span class="matkul-nama">${esc(k.nama)}</span>
          <span class="matkul-kode">${esc(k.kode)}</span>
          ${badge}
          ${k.catatan ? `<span class="matkul-catatan">${esc(k.catatan)}</span>` : ''}
        </td>
        <td class="col-kp"><span class="kp-pill">${esc(k.kp)}</span></td>
        <td class="col-ruang">${esc(k.ruang || '-')}</td>
      </tr>`;
    }).join('');

    const hitung = s => semua.filter(k => k.status === s).length;
    const ringkas = [
      `${kelas.length} kelas${q ? ' cocok' : ''}`,
      hitung('belum')     ? `${hitung('belum')} belum dimulai` : '',
      hitung('libur')     ? `${hitung('libur')} ditiadakan` : '',
      hitung('daring')    ? `${hitung('daring')} daring` : '',
      hitung('ruang')     ? `${hitung('ruang')} pindah ruang` : '',
      hitung('menyusul')  ? `${hitung('menyusul')} jadwal menyusul` : '',
      hitung('pengganti') ? `${hitung('pengganti')} kelas pengganti` : '',
    ].filter(Boolean).join(' · ');

    elIsi.innerHTML = `
      <div class="jadwal-card">
        <div class="jadwal-scroll">
          <table class="jadwal-table">
            <caption class="sr-only">Jadwal kelas ${esc(tglPanjang(iso(tgl)))}</caption>
            <thead>
              <tr><th scope="col">Jam</th><th scope="col">Mata Kuliah</th><th scope="col">KP</th><th scope="col">Ruang</th></tr>
            </thead>
            <tbody>${baris}</tbody>
          </table>
        </div>
        <p class="jadwal-count">${esc(tglPanjang(iso(tgl)))} · ${ringkas}</p>
      </div>`;
  }

  /* ---------- kotak "perkuliahan belum dimulai" ---------- */
  function renderSemester(){
    if(!data.mulai || !data.mulai.default) return;

    const hariIni = iso(new Date());

    // Kumpulkan tanggal mulai yang belum terlewati, beserta matkul yang terkait.
    const kelompok = new Map();
    const semuaKode = new Set();
    for(const d of data.days) for(const k of d.classes) semuaKode.add(k.kode);

    for(const kode of semuaKode){
      const m = mulaiUntuk(kode);
      if(!m || m <= hariIni) continue;
      if(!kelompok.has(m)) kelompok.set(m, new Set());
      const nama = data.days.flatMap(d => d.classes).find(k => k.kode === kode)?.nama;
      if(nama) kelompok.get(m).add(nama);
    }
    if(kelompok.size === 0) return;

    const urut = [...kelompok.entries()].sort((a,b) => a[0].localeCompare(b[0]));
    const item = urut.map(([tgl, nama]) => {
      const daftar = [...nama].sort();
      // Kalau hampir semua matkul mulai di tanggal ini, tidak usah dirinci.
      const rinci = daftar.length <= 6
        ? `<span class="mulai-matkul">${daftar.map(esc).join(' · ')}</span>` : '';
      return `<li class="perub-item">
        <span class="perub-tanggal">${esc(tglPanjang(tgl))}</span>
        <span class="perub-teks">${daftar.length} mata kuliah mulai berjalan${rinci}</span>
      </li>`;
    }).join('');

    elSemester.innerHTML = `
      <div class="kotak kotak-info">
        <h3>🗓️ Sebagian perkuliahan belum dimulai</h3>
        <p>Kelas yang belum berjalan diredupkan dan diberi label <strong>Belum dimulai</strong>.</p>
        <ul class="perub-list" style="margin-top:14px;">${item}</ul>
      </div>`;
  }

  /* ---------- kotak perubahan terdekat ---------- */
  function renderPerubahan(){
    const changes = data.changes || [];
    if(changes.length === 0) return;

    const hariIni = iso(new Date());
    const mendatang = changes.filter(c => c.tanggal >= hariIni).slice(0, 12);
    if(mendatang.length === 0) return;

    const item = mendatang.map(c => `
      <li class="perub-item">
        <span class="perub-tanggal">${esc(tglPanjang(c.tanggal))}</span>
        <span class="perub-teks">
          <span class="tag tag-${esc(c.tipe)}">${esc({ libur:'Ditiadakan', pengganti:'Pengganti', ruang:'Pindah ruang', daring:'Online' }[c.tipe] || c.tipe)}</span>
          <strong>${esc(c.nama)}</strong> KP ${esc(c.kp)} · ${esc(c.jam)}${c.ruang ? ' · ' + esc(c.ruang) : ''}
        </span>
      </li>`).join('');

    elPerub.innerHTML = `
      <div class="kotak kotak-info">
        <h3>📌 Perubahan jadwal terdekat</h3>
        <ul class="perub-list">${item}</ul>
      </div>`;
  }

  /* ---------- kotak peringatan data ----------
     Hanya dipasang kalau ada baris yang benar-benar GAGAL ditampilkan.
     Catatan kualitas data (data.warnings) sengaja tidak dimunculkan di sini:
     barisnya tetap tampil, jadi buat mahasiswa tidak ada yang perlu
     dikhawatirkan. Itu urusan pengurus lewat log GitHub Actions. */
  function renderPeringatan(){
    // Gagal mengambil data terkini lebih penting diberitahukan daripada
    // sekadar baris yang terlewat, jadi diperiksa lebih dulu.
    if(data._cadangan){
      elPering.innerHTML = `
        <div class="kotak kotak-warn">
          <h3>⚠️ Jadwal mungkin belum yang terbaru</h3>
          <p>Untuk kepastian, konfirmasi ke asisten atau cek Instagram KAFBE.</p>
        </div>`;
      return;
    }

    const s = data.skipped || [];
    if(s.length === 0) return;
    elPering.innerHTML = `
      <div class="kotak kotak-warn">
        <h3>⚠️ Sebagian perubahan jadwal belum tampil</h3>
        <p>Untuk kepastian, konfirmasi ke asisten atau cek Instagram KAFBE.</p>
      </div>`;
  }

  function tampilkanMeta(){
    if(!elMeta) return;

    const t = data.updatedAt ? new Date(data.updatedAt) : null;
    if(!t || isNaN(t)){ elMeta.textContent = ''; return; }
    // Ditampilkan dalam zona waktu perangkat pembaca, bukan zona waktu server.
    const tgl = t.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
    const jam = t.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
    elMeta.textContent = `Terakhir diperbarui: ${tgl} pukul ${jam}`;
  }

  /*
    Sumber utamanya satu dokumen Firestore yang ditulis ulang oleh halaman
    /operasional setiap kali pengurus menyimpan, jadi perubahan langsung
    tayang. Sengaja satu dokumen, bukan satu dokumen per kelas, supaya tiap
    pengunjung hanya menimbulkan satu pembacaan.

    Kalau karena satu dan lain hal dokumen itu tidak terbaca, halaman jatuh ke
    berkas statis di repo. Berkas itu bisa saja tertinggal zaman, tapi jauh
    lebih baik daripada halaman jadwal yang kosong sama sekali.
  */
  async function ambilDariFirestore(){
    const c = window.KAFBE_FIREBASE_CONFIG;
    if(!c || !c.apiKey) return null;
    const SDK = 'https://www.gstatic.com/firebasejs/10.13.0';
    const { initializeApp } = await import(`${SDK}/firebase-app.js`);
    const { getFirestore, doc, getDoc } = await import(`${SDK}/firebase-firestore.js`);
    const snap = await getDoc(doc(getFirestore(initializeApp(c)), 'publik', 'terkini'));
    if(!snap.exists()) return null;
    const d = snap.data();
    return (d.days && d.days.length) ? d : null;
  }

  async function muat(){
    try{
      let firestoreBermasalah = false;
      try{
        data = await ambilDariFirestore();
      }catch(err){
        console.warn('Gagal membaca jadwal dari Firestore, memakai berkas cadangan.', err);
        data = null;
        firestoreBermasalah = true;
      }

      if(!data){
        // cache: 'no-cache' → browser tetap pakai cache, tapi selalu
        // memvalidasi ke server, jadi update jadwal langsung kelihatan.
        const res = await fetch('data/jadwal.json', { cache: 'no-cache' });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
        // Berkas ini tidak lagi ikut diperbarui pengurus, jadi isinya bisa
        // tertinggal. Pembaca berhak tahu bahwa yang dilihatnya bukan versi
        // terkini, bukan dibiarkan mengira jadwal lama masih berlaku.
        //
        // Tapi peringatan hanya dipasang kalau Firestore benar-benar
        // bermasalah. Dokumen yang memang belum pernah dibuat, misalnya saat
        // sistem baru dipasang, bukan keadaan darurat dan tidak perlu
        // menakuti mahasiswa.
        if(firestoreBermasalah) data._cadangan = true;
      }
      if(!data.days || data.days.length === 0) throw new Error('data jadwal kosong');

      hariAktif = HARI[new Date().getDay()];
      renderSemester();
      renderPerubahan();
      renderPeringatan();
      render();
      tampilkanMeta();

      elCari.addEventListener('input', render);
      btnPrev.addEventListener('click', () => { offsetMinggu--; render(); });
      btnNext.addEventListener('click', () => { offsetMinggu++; render(); });
      btnThis.addEventListener('click', () => { offsetMinggu = 0; render(); });
    }catch(err){
      console.error('Gagal memuat jadwal:', err);
      elIsi.innerHTML = `
        <div class="jadwal-card">
          <p class="jadwal-status">
            Jadwal belum bisa dimuat. Coba muat ulang halaman ini beberapa saat lagi.
            Untuk info pasti, cek Instagram KAFBE.
          </p>
        </div>`;
      elTabs.innerHTML = '';
      elCari.style.display = 'none';
    }
  }

  muat();
})();
</script>
