<!--
  Lambang tab peramban KAFBE Hub.

  KENAPA EMOJI, BUKAN GAMBAR BURUNG HANTU KAFBE

  Sempat dipakai gambar burung hantu situs ini, dan hasilnya tidak terbaca.
  Di bilah tab gambarnya tampil sekitar 16 piksel. Pada ukuran itu mata,
  paruh, sayap, dan garis tubuhnya saling melebur jadi satu gumpalan biru
  yang tidak dikenali siapa pun sebagai burung hantu.

  Emoji dirancang justru untuk ukuran sekecil itu: bentuknya sudah
  disederhanakan dan kontrasnya sudah diatur oleh pembuat sistemnya, jadi
  tetap terbaca di tab yang sempit.

  Gambar burung hantu KAFBE yang lengkap tidak dibuang, hanya pindah tempat
  ke ikon-ponsel.svg, yang dipakai untuk ikon layar utama ponsel. Di sana
  ukurannya 180 piksel, dan detailnya justru terlihat.

  CATATAN: berkas ini XML, dan komentar XML TIDAK BOLEH memuat dua tanda
  hubung berurutan. Menulis nama peubah warna lengkap dengan awalannya di
  dalam komentar akan membuat seluruh berkas dianggap rusak dan lambangnya
  tidak muncul sama sekali.
-->
<text x="16" y="16" font-size="28" text-anchor="middle" dominant-baseline="central">🦉</text>
</svg>
