name: Sinkronisasi jadwal kelas

# Mengambil jadwal dari Google Sheets tiap 3 jam dan commit hasilnya ke
# data/jadwal.json bila ada perubahan.
#
# SETUP SEKALI SAJA:
#   Settings → Secrets and variables → Actions → tab "Variables" → New variable
#     Name : SHEET_ID
#     Value: id Google Sheet (bagian di URL antara /d/ dan /edit)
#
#   Sheet-nya juga harus di-Share → "Anyone with the link" → Viewer,
#   karena workflow ini membacanya tanpa login.

# ============================================================
# TIDAK LAGI BERJALAN OTOMATIS. Sengaja.
#
# Sejak halaman /operasional ada, jadwal disunting langsung lewat halaman itu
# dan tersimpan di Firestore. Google Sheets tidak lagi menjadi sumber jadwal.
#
# Kalau sinkronisasi ini tetap dibiarkan berjalan, ia akan menimpa
# data/jadwal.json dengan isi sheet yang sudah tidak diurus, sehingga salinan
# cadangan di situs justru menampilkan jadwal usang. Itu sebabnya jadwal cron
# di bawah dinonaktifkan.
#
# Berkas ini tidak dihapus supaya cara kerja lamanya tetap terekam, dan supaya
# gampang dihidupkan lagi kalau suatu saat pengurus memutuskan kembali memakai
# spreadsheet: cukup hapus tanda pagar pada dua baris "schedule" di bawah.
# ============================================================

on:
  # schedule:
  #   - cron: '0 */3 * * *'   # tiap 3 jam, waktu UTC
  workflow_dispatch:           # hanya jalan kalau ditekan manual di tab Actions

# Diperlukan agar workflow boleh push commit balik ke repo.
permissions:
  contents: write

# Kalau ada run yang masih jalan, biarkan selesai, jangan sampai dua run
# saling menimpa commit.
concurrency:
  group: sync-jadwal
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ambil jadwal dari Google Sheets
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: node scripts/sync-jadwal.mjs

      - name: Commit bila jadwal berubah
        run: |
          if [ -z "$(git status --porcelain data/jadwal.json)" ]; then
            echo "Tidak ada perubahan jadwal, tidak ada yang di-commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jadwal.json
          git commit -m "Perbarui jadwal kelas dari Google Sheets"
          git push
