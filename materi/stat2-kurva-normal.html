<style>
  .back-link{font-weight:600; font-size:0.9rem; color:var(--ink-soft); text-decoration:none; display:inline-flex; align-items:center; gap:6px;}
  .back-link:hover{color:var(--owl-dark2);}

  .story-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:28px; box-shadow:var(--shadow); margin-top:24px;
  }

  .chapter-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:22px;}

    font-family:'Baloo 2'; font-weight:700; font-size:0.82rem; padding:6px 14px; border-radius:100px;

  }
  .progress-dots{display:flex; gap:6px;}
  .progress-dots .dot{width:8px; height:8px; border-radius:50%; background:var(--line); transition:background .2s, transform .2s;}
  .progress-dots .dot.active{background:var(--gold); transform:scale(1.3);}
  .progress-dots .dot.done{background:var(--owl-mid);}

  .story-layout{display:grid; grid-template-columns:300px 1fr; gap:26px; align-items:start;}
  @media (max-width:820px){ .story-layout{display:flex; flex-direction:column; gap:18px;} }

  .owl-panel{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .owl-panel svg{width:150px;}
  .owl-panel .wing-l{transform-origin:78px 150px; animation:flapL 2.6s ease-in-out infinite;}
  .owl-panel .wing-r{transform-origin:222px 150px; animation:flapR 2.6s ease-in-out infinite;}
  .owl-panel .eyes-blink{transform-origin:150px 128px; animation:blink 4.5s ease-in-out infinite;}
  @media (max-width:820px){ .owl-panel svg{width:84px;} .owl-panel{gap:8px;} }

  .bubble{
    position:relative; background:var(--bg-deep); border-radius:18px; padding:16px 18px;
    font-size:0.94rem; line-height:1.6; color:var(--ink); min-height:118px;
  }
  .bubble::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:9px solid var(--bg-deep);
  }
  @media (min-width:821px){
    .bubble::before{ top:26px; left:-9px; transform:none; border-left:none; border-bottom:9px solid transparent; border-top:9px solid transparent; border-right:9px solid var(--bg-deep); }
  }

  .chart-wrap{background:var(--bg-deep); border-radius:20px; padding:16px;}
  #chartSvg{width:100%; height:auto; aspect-ratio:620/430; display:block;}

  /* Elemen mulai tersembunyi, lalu dimunculkan langkah demi langkah. */
  .viz-hide{opacity:0; transition:opacity .5s ease;}
  .viz-hide.revealed{opacity:1;}
  /* Tiap titik muncul sambil naik sedikit, supaya terasa "dijatuhkan" ke tumpukan. */
  .orang{opacity:0; transform:translateY(7px); transition:opacity .4s ease, transform .4s ease;}
  .orang.revealed{opacity:1; transform:translateY(0);}
  .kurva-garis{transition:stroke-dashoffset 1.1s ease;}

  .nav-row{display:flex; align-items:center; justify-content:space-between; margin-top:24px; gap:12px; flex-wrap:wrap;}
  .nav-row .spacer{flex:1;}
  #btnRestart{display:none;}

<script src="../main.js"></script>
<script>
(function(){
  "use strict";

  // ===================================================================
  // Data tinggi badan.
  //
  // Angkanya sengaja ditetapkan, bukan diacak, supaya gambarnya selalu sama
  // setiap kali halaman dibuka dan enak dipakai menjelaskan di depan kelas.
  // Tiap orang digambar sebagai satu titik; yang tingginya sama menumpuk.
  // ===================================================================
  // Sengaja simetris terhadap 170 cm. Kurva normal itu simetris, jadi kalau
  // datanya berat sebelah, kurvanya akan melayang di atas tumpukan pada satu
  // sisi, dan justru merusak inti pelajarannya bahwa kurva ini muncul DARI
  // data, bukan digambar di atasnya.
  const DATA = [
    { cm:140, n:1  }, { cm:145, n:2  }, { cm:150, n:4  }, { cm:155, n:7  },
    { cm:160, n:11 }, { cm:165, n:14 }, { cm:170, n:16 }, { cm:175, n:14 },
    { cm:180, n:11 }, { cm:185, n:7  }, { cm:190, n:4  }, { cm:195, n:2  },
    { cm:200, n:1  }
  ];
  const TOTAL = DATA.reduce((s, d) => s + d.n, 0);
  const MAKS  = Math.max(...DATA.map(d => d.n));

  // Orang-orang yang diceritakan satu per satu di awal. Angka 170 muncul tiga
  // kali dengan sengaja: pengulangan itulah yang membuat pembaca merasakan
  // sendiri bahwa tinggi di sekitar rata-rata jauh lebih sering ditemui.
  const CERITA = [
    { cm:170, idx:0 }, { cm:165, idx:0 }, { cm:160, idx:0 },
    { cm:140, idx:0 }, { cm:190, idx:0 },
    { cm:170, idx:1 }, { cm:170, idx:2 }
  ];
  const dipakaiCerita = (cm, i) => CERITA.some(c => c.cm === cm && c.idx === i);
  const idTitik = (cm, i) => `t-${cm}-${i}`;
  const idLabel = (cm, i) => `l-${cm}-${i}`;

  const BAB = {
    ukur:  'Bagian: Mengukur satu per satu',
    banyak:'Bagian: Setelah orangnya banyak',
    kurva: 'Bagian: Kurva normal'
  };

  /*
    tampil : muncul di langkah ini dan tetap terlihat sesudahnya
    sorot  : hanya terlihat pada langkah ini saja

    Label tinggi badan masuk ke "sorot", bukan "tampil". Kalau semuanya
    dibiarkan menumpuk, label 160 dan 165 saling menimpa karena titiknya
    bersebelahan dan sama-sama di baris terbawah.
  */
  const LANGKAH = [
    { bab:'ukur', tampil:[], sorot:[],
      teks:'Coba ukur tinggi badan orang-orang di sekitarmu. Garis mendatar di sebelah ini adalah tinggi badan, dalam sentimeter.' },
    { bab:'ukur', tampil:[idTitik(170,0)], sorot:[idLabel(170,0)],
      teks:'Orang pertama tingginya <strong>170 cm</strong>. Kita taruh satu titik tepat di angka itu.' },
    { bab:'ukur', tampil:[idTitik(165,0)], sorot:[idLabel(165,0)],
      teks:'Orang kedua <strong>165 cm</strong>, sedikit lebih pendek, jadi titiknya bergeser ke kiri.' },
    { bab:'ukur', tampil:[idTitik(160,0)], sorot:[idLabel(160,0)],
      teks:'Orang ketiga <strong>160 cm</strong>. Titik baru lagi, bergeser sedikit lagi ke kiri.' },
    { bab:'ukur', tampil:[idTitik(140,0)], sorot:[idLabel(140,0)],
      teks:'Ada juga yang jauh lebih pendek, <strong>140 cm</strong>. Titiknya sendirian di ujung kiri.' },
    { bab:'ukur', tampil:[idTitik(190,0)], sorot:[idLabel(190,0)],
      teks:'Dan ada yang jauh lebih tinggi, <strong>190 cm</strong>. Sendirian juga di ujung kanan.' },
    { bab:'ukur', tampil:[idTitik(170,1), idTitik(170,2)], sorot:[idLabel(170,1)],
      teks:'Orang berikutnya <strong>170 cm</strong> lagi. Begitu juga yang sesudahnya. Titiknya tidak bergeser ke mana-mana, malah menumpuk di atas yang tadi, karena tinggi segini memang paling sering ditemui.' },
    { bab:'banyak', tampil:['sisa'], sorot:[],
      teks:`Sekarang ukur ${TOTAL} orang. Tiap orang tetap satu titik, dan yang tingginya sama menumpuk ke atas.` },
    { bab:'banyak', tampil:['pusat','pusatLbl'], sorot:[],
      teks:'Tumpukannya paling tebal di sekitar <strong>170 cm</strong>. Di sinilah kebanyakan orang berkumpul.' },
    { bab:'banyak', tampil:['ekorKiri','ekorKanan','ekorLblKiri','ekorLblKanan'], sorot:[],
      teks:'Yang sangat pendek dan yang sangat tinggi sama-sama sedikit. Kedua ujungnya tipis, cuma satu dua titik.' },
    { bab:'kurva', tampil:['kurva','kurvaLbl'], sorot:[],
      teks:'Kalau puncak tiap tumpukan kita ikuti, garisnya melengkung: menggunung di tengah, melandai ke kiri dan ke kanan. Inilah <strong>kurva normal</strong>.' },
    { bab:'kurva', tampil:['ringkas'], sorot:[],
      teks:'Kurva ini tidak dikarang, melainkan muncul sendiri dari data nyata. Pola yang sama terlihat pada berat badan, nilai ujian, dan ukuran sepatu. Itu sebabnya <strong>distribusi normal</strong> dipakai di mana-mana.' }
  ];

  // ===================================================================
  // Gambar
  // ===================================================================
  const W = 620, H = 430;
  const tepi = { kiri:52, kanan:24, atas:26, bawah:56 };
  const lebarPlot = W - tepi.kiri - tepi.kanan;
  const tinggiPlot = H - tepi.atas - tepi.bawah;

  const CM_MIN = 134, CM_MAKS = 206;
  const dasarY = tepi.atas + tinggiPlot;

  const sx = (cm) => tepi.kiri + ((cm - CM_MIN) / (CM_MAKS - CM_MIN)) * lebarPlot;

  const R = 5.2;          // jari-jari titik
  const JARAK = 11;       // jarak antar titik dalam satu tumpukan
  const cyTitik = (i) => dasarY - 9 - i * JARAK;

  // Tinggi puncak kurva disamakan dengan puncak tumpukan tertinggi, supaya
  // kurvanya benar-benar terlihat mengikuti data, bukan sekadar ditempel.
  const puncak = (MAKS - 1) * JARAK + 9 + R;
  // Simpangan baku 11,5 dipilih karena paling pas menempel pada puncak
  // tumpukan data di atas, bukan angka yang diambil sembarangan.
  const SD = 11.5;
  const pdf = (cm) => Math.exp(-Math.pow(cm - 170, 2) / (2 * SD * SD));

  function jalurKurva(){
    const titik = [];
    for(let cm = CM_MIN + 1; cm <= CM_MAKS - 1; cm += 0.5){
      titik.push(`${sx(cm).toFixed(1)},${(dasarY - pdf(cm) * puncak).toFixed(1)}`);
    }
    return 'M' + titik.join(' L');
  }

  function gambar(){
    let s = '';

    // Sumbu dan garis bantu
    s += `<line x1="${tepi.kiri}" y1="${dasarY}" x2="${W - tepi.kanan}" y2="${dasarY}"
           stroke="var(--owl-dark2)" stroke-width="2"/>`;
    for(const d of DATA){
      if(d.cm % 10 !== 0) continue;
      s += `<line x1="${sx(d.cm)}" y1="${dasarY}" x2="${sx(d.cm)}" y2="${dasarY + 6}"
             stroke="var(--owl-dark2)" stroke-width="2"/>`;
      s += `<text x="${sx(d.cm)}" y="${dasarY + 24}" text-anchor="middle"
             font-size="13" fill="var(--ink-soft)">${d.cm}</text>`;
    }
    s += `<text x="${tepi.kiri + lebarPlot / 2}" y="${H - 8}" text-anchor="middle"
           font-size="13" font-weight="700" fill="var(--ink-soft)">Tinggi badan (cm)</text>`;
    s += `<text x="14" y="${tepi.atas + 90}" font-size="13" font-weight="700"
           fill="var(--ink-soft)" transform="rotate(-90 14 ${tepi.atas + 90})"
           text-anchor="middle">Banyaknya orang</text>`;

    /*
      Sorotan sengaja hanya setinggi tumpukan di daerahnya, bukan setinggi
      seluruh bidang gambar. Kotak setinggi penuh menutupi titik-titiknya dan
      malah terbaca sebagai batang histogram, padahal yang sedang diceritakan
      justru titik-titik itu sendiri.

      Tulisannya ditaruh di atas kotak, bukan di dalamnya, dan warnanya gelap
      supaya tetap terbaca.
    */
    const tinggiTumpukan = (nMaks) => 9 + (nMaks - 1) * JARAK + R + 8;

    function sorotan(id, dariCm, sampaiCm, warna, nMaks){
      const x1 = sx(dariCm), x2 = sx(sampaiCm);
      const t = tinggiTumpukan(nMaks);
      return `<rect id="${id}" class="viz-hide" x="${x1}" y="${dasarY - t}"
               width="${x2 - x1}" height="${t}"
               fill="${warna}" opacity="0.18" rx="8"/>`;
    }

    const maksPusat = Math.max(...DATA.filter(d => d.cm >= 165 && d.cm <= 175).map(d => d.n));
    const maksEkor  = Math.max(...DATA.filter(d => d.cm <= 150 || d.cm >= 190).map(d => d.n));

    s += sorotan('pusat', 162.5, 177.5, 'var(--gold)', maksPusat);
    s += `<text id="pusatLbl" class="viz-hide" x="${sx(170)}"
           y="${dasarY - tinggiTumpukan(maksPusat) - 10}" text-anchor="middle"
           font-size="13" font-weight="800" fill="var(--owl-dark2)">paling banyak di sini</text>`;

    s += sorotan('ekorKiri', CM_MIN + 2, 152.5, 'var(--owl-mid)', maksEkor);
    s += sorotan('ekorKanan', 187.5, CM_MAKS - 2, 'var(--owl-mid)', maksEkor);
    const yEkorLbl = dasarY - tinggiTumpukan(maksEkor) - 10;
    s += `<text id="ekorLblKiri" class="viz-hide" x="${sx(144)}" y="${yEkorLbl}"
           text-anchor="middle" font-size="12" font-weight="800"
           fill="var(--owl-dark)">sedikit</text>`;
    s += `<text id="ekorLblKanan" class="viz-hide" x="${sx(196)}" y="${yEkorLbl}"
           text-anchor="middle" font-size="12" font-weight="800"
           fill="var(--owl-dark)">sedikit</text>`;

    // Titik-titik. Yang bukan bagian cerita awal dikumpulkan dalam satu grup
    // supaya bisa dimunculkan sekaligus.
    let sisa = '';
    for(const d of DATA){
      for(let i = 0; i < d.n; i++){
        const bulat = `<circle cx="${sx(d.cm)}" cy="${cyTitik(i)}" r="${R}"
                        fill="var(--owl-mid)" stroke="var(--surface)" stroke-width="1.5"/>`;
        if(dipakaiCerita(d.cm, i)){
          s += `<g id="${idTitik(d.cm, i)}" class="orang">
                  <circle cx="${sx(d.cm)}" cy="${cyTitik(i)}" r="${R + 2}"
                   fill="var(--gold)" opacity="0.45"/>${bulat}</g>`;
        }else{
          sisa += `<g class="orang">${bulat}</g>`;
        }
      }
    }
    s += `<g id="sisa">${sisa}</g>`;

    // Label tinggi badan, satu untuk tiap orang yang diceritakan. Diberi latar
    // agar tetap terbaca kalau kebetulan jatuh di atas sorotan.
    for(const c of CERITA){
      const x = sx(c.cm), y = cyTitik(c.idx) - 15;
      s += `<g id="${idLabel(c.cm, c.idx)}" class="viz-hide">
              <rect x="${x - 30}" y="${y - 13}" width="60" height="19" rx="9"
               fill="var(--surface)" opacity="0.92"/>
              <text x="${x}" y="${y}" text-anchor="middle" font-size="12"
               font-weight="800" fill="var(--owl-dark2)">${c.cm} cm</text>
            </g>`;
    }

    // Kurva normal
    s += `<path id="kurva" class="kurva-garis" d="${jalurKurva()}" fill="none"
           stroke="var(--gold-deep)" stroke-width="3.5" stroke-linecap="round"/>`;
    s += `<text id="kurvaLbl" class="viz-hide" x="${sx(184)}" y="${dasarY - puncak - 2}"
           font-size="14" font-weight="800" fill="var(--gold-deep)">kurva normal</text>`;

    s += `<text id="ringkas" class="viz-hide" x="${tepi.kiri + lebarPlot / 2}" y="${tepi.atas + 6}"
           text-anchor="middle" font-size="14" font-weight="800"
           fill="var(--owl-dark2)">${TOTAL} orang, dan bentuknya muncul dengan sendirinya</text>`;

    return s;
  }

  // ===================================================================
  // Jalannya cerita
  // ===================================================================
  const svg     = document.getElementById('chartSvg');
  const bubble  = document.getElementById('bubbleText');
  const badge   = document.getElementById('chapterBadge');
  const dots    = document.getElementById('progressDots');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnUlang= document.getElementById('btnRestart');

  svg.innerHTML = gambar();

  const kurva = document.getElementById('kurva');
  const panjangKurva = kurva.getTotalLength();
  kurva.style.strokeDasharray = panjangKurva;

  let ke = 0;

  function tampilkan(){
    const langkah = LANGKAH[ke];

    // Semua yang seharusnya sudah muncul sampai langkah ini, ditambah yang
    // hanya berlaku pada langkah yang sedang dibuka.
    const munculkan = new Set();
    for(let i = 0; i <= ke; i++) LANGKAH[i].tampil.forEach(id => munculkan.add(id));
    langkah.sorot.forEach(id => munculkan.add(id));

    for(const l of LANGKAH){
      for(const id of l.tampil.concat(l.sorot)){
        const el = document.getElementById(id);
        if(!el) continue;
        if(id === 'sisa'){
          el.querySelectorAll('.orang').forEach(g => g.classList.toggle('revealed', munculkan.has('sisa')));
        }else{
          el.classList.toggle('revealed', munculkan.has(id));
        }
      }
    }

    // Kurva digambar dari kiri ke kanan, bukan sekadar muncul.
    kurva.style.strokeDashoffset = munculkan.has('kurva') ? 0 : panjangKurva;

    bubble.innerHTML = langkah.teks;
    badge.textContent = BAB[langkah.bab];

    dots.innerHTML = LANGKAH.map((_, i) =>
      `<span class="dot ${i === ke ? 'active' : (i < ke ? 'done' : '')}"></span>`).join('');

    btnPrev.disabled = ke === 0;
    const terakhir = ke === LANGKAH.length - 1;
    btnNext.style.display = terakhir ? 'none' : '';
    btnUlang.style.display = terakhir ? '' : 'none';
  }

  btnNext.addEventListener('click', () => { if(ke < LANGKAH.length - 1){ ke++; tampilkan(); } });
  btnPrev.addEventListener('click', () => { if(ke > 0){ ke--; tampilkan(); } });
  btnUlang.addEventListener('click', () => { ke = 0; tampilkan(); });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') btnNext.click();
    if(e.key === 'ArrowLeft') btnPrev.click();
  });

  tampilkan();
})();
</script>
